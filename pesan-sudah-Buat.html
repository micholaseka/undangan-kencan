<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#150826" />
    <meta
      name="description"
      content="Pesan kencanmu sudah dibuat. Sampai jumpa di hari istimewa!"
    />
    <title>Pesan Kencan Sudah Dibuat 💜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Aurora background -->
    <div class="aurora" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
      <span class="grain"></span>
    </div>

    <!-- Floating hearts layer -->
    <div class="hearts" id="heartsLayer" aria-hidden="true"></div>

    <!-- Confetti canvas -->
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <main class="container">
      <article class="card success-card">
        <!-- Animated check -->
        <div class="check-wrap" aria-hidden="true">
          <svg class="check-svg" viewBox="0 0 64 64">
            <defs>
              <linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff4d8d" />
                <stop offset="50%" stop-color="#e879f9" />
                <stop offset="100%" stop-color="#8b5cf6" />
              </linearGradient>
            </defs>
            <circle class="check-circle" cx="32" cy="32" r="27" />
            <path class="check-mark" d="M20 33.5l8.5 8.5L45 24.5" />
          </svg>
        </div>

        <header class="card-header">
          <h1 class="title">
            <span class="title-top">Terima Kasih!</span>
          </h1>
          <p class="subheader">
            Pesan kencanmu <em class="script-inline">sudah dibuat</em> — sampai
            jumpa besok pub. 💜
          </p>
        </header>

        <!-- Detail kencan -->
        <section class="invitation-details" aria-label="Detail kencan">
          <h2 class="section-title">Detail Kencan</h2>
          <ul class="details">
            <li class="detail-item">
              <span class="icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <rect x="3" y="4.5" width="18" height="16.5" rx="3" />
                  <path d="M8 2.5v4M16 2.5v4M3 9.5h18" />
                  <path
                    d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"
                  />
                </svg>
              </span>
              <span class="detail-text">
                <span class="label">Tanggal</span>
                <span class="value">8 Oktober 2026</span>
              </span>
            </li>
            <li class="detail-item">
              <span class="icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7.5V12l3 2" />
                </svg>
              </span>
              <span class="detail-text">
                <span class="label">Waktu</span>
                <span class="value">Bar ko sekolah</span>
              </span>
            </li>
            <li class="detail-item">
              <span class="icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M12 21s-6.5-5.3-6.5-10.2A6.5 6.5 0 0 1 12 4.3a6.5 6.5 0 0 1 6.5 6.5C18.5 15.7 12 21 12 21z"
                  />
                  <circle cx="12" cy="10.6" r="2.4" />
                </svg>
              </span>
              <span class="detail-text">
                <span class="label">Tempat</span>
                <span class="value">sali mbandung kae</span>
              </span>
            </li>
          </ul>
        </section>

        <!-- Pesan organizer -->
        <section class="additional-message" aria-label="Pesan dari organizer">
          <h3>💌 Pesan dari pupub tercinta.</h3>
          <p>aku sudah bener bener kangen kangen bangets.</p>
        </section>
      </article>
    </main>

    <script src="script.js"></script>
  </body>
</html>
